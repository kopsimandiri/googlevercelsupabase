  // ========== ANIMATED COUNTER ==========
  function initCounters() {
    const counters = document.querySelectorAll('.counter-value');
    if (!counters.length) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const el = entry.target;
          const target = parseInt(el.getAttribute('data-target')) || 0;
          if (target === 0) return;
          let current = 0;
          const duration = 2000;
          const steps = 60;
          const increment = target / steps;
          let step = 0;
          const timer = setInterval(() => {
            step++;
            current = Math.min(current + increment, target);
            el.textContent = Math.floor(current);
            if (step >= steps) {
              el.textContent = target;
              clearInterval(timer);
            }
          }, duration / steps);
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.3 });
    counters.forEach(c => observer.observe(c));
  }

  // ========== LIGHTBOX ==========
  function openLightbox(el) {
    const img = el.querySelector('img');
    if (!img) return;
    let lightbox = document.getElementById('lightbox');
    if (!lightbox) {
      lightbox = document.createElement('div');
      lightbox.id = 'lightbox';
      lightbox.className = 'lightbox';
      lightbox.innerHTML = `
        <button class="close-lightbox" onclick="closeLightbox()">&times;</button>
        <img src="" alt="Lightbox">
      `;
      document.body.appendChild(lightbox);
      lightbox.addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
      });
    }
    const lightboxImg = lightbox.querySelector('img');
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt || 'Gallery Image';
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    const lightbox = document.getElementById('lightbox');
    if (lightbox) {
      const container = document.getElementById('video-container');
      if (container) container.innerHTML = '';
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
  }

      lightbox.innerHTML = `

        <div id="video-container" style="width:90%; max-width:800px; position:relative; padding-bottom:56.25%; height:0;"></div>

      document.body.appendChild(lightbox);
      lightbox.addEventListener('click', function(e) {

  // ========== MOBILE TOGGLE ==========
  function initPortalMobileToggle() {
    const header = document.querySelector('.portal-header');
    const toggleBtn = document.querySelector('.portal-menu-toggle');
    const sidebar = document.querySelector('.sidebar-portal');

    if (window.innerWidth <= 768) {
      if (!toggleBtn) {
        const btn = document.createElement('button');
        btn.className = 'portal-menu-toggle';
        btn.innerHTML = '<i class="fas fa-bars"></i>';
        btn.setAttribute('aria-label', 'Toggle navigation');
        const brandTitle = document.querySelector('.brand-title');
        if (brandTitle && header) {
          header.insertBefore(btn, brandTitle);
        }
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (sidebar) sidebar.classList.toggle('active');
        });
        document.addEventListener('click', function(event) {
          if (sidebar && sidebar.classList.contains('active') &&
              !sidebar.contains(event.target) &&
              !btn.contains(event.target)) {
            sidebar.classList.remove('active');
          }
        });
        document.querySelectorAll('.sidebar-portal .nav-item').forEach(item => {
          item.addEventListener('click', function() {
            setTimeout(() => {
              if (sidebar) sidebar.classList.remove('active');
            }, 300);
          });
        });
      }
    } else {
      const oldBtn = document.querySelector('.portal-menu-toggle');
      if (oldBtn) oldBtn.remove();
      if (sidebar) sidebar.classList.remove('active');
    }
  }

  // ========== INIT ==========
  window.addEventListener('load', function() {
    loadPage('home', document.querySelector('.nav-item'));
    initPortalMobileToggle();
  });

  window.addEventListener('resize', function() {
