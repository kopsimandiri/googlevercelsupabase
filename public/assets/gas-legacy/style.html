<style>
  /* ============================================================
     ROOT VARIABLES (Design System V2 — Professional)
     ============================================================ */
  :root {
    /* Brand Colors */
    --color-primary: #0B5D3F;
    --color-primary-dark: #08452E;
    --color-primary-light: #1F7A52;
    --color-accent: #C8A64A;
    --color-accent-dark: #B08F3A;
    --color-accent-light: #DABE6A;

    /* Neutrals */
    --color-white: #FFFFFF;
    --color-off-white: #F8FAF8;
    --color-gray-50: #F9FAFB;
    --color-gray-100: #F3F4F6;
    --color-gray-200: #E5E7EB;
    --color-gray-300: #D1D5DB;
    --color-gray-400: #9CA3AF;
    --color-gray-500: #6B7280;
    --color-gray-600: #4B5563;
    --color-gray-700: #374151;
    --color-gray-800: #1F2937;
    --color-gray-900: #111827;

    /* Semantic */
    --color-success: #16A34A;
    --color-warning: #F59E0B;
    --color-danger: #DC2626;
    --color-info: #3B82F6;

    /* Typography */
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-heading: 'Playfair Display', 'Cinzel', serif;

    /* Spacing */
    --spacing-1: 4px;
    --spacing-2: 8px;
    --spacing-3: 12px;
    --spacing-4: 16px;
    --spacing-5: 20px;
    --spacing-6: 24px;
    --spacing-8: 32px;
    --spacing-10: 40px;
    --spacing-12: 48px;
    --spacing-16: 64px;

    /* Radius */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;

    /* Shadow */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);

    /* Legacy support */
    --primary: #0B5D3F;
    --primary-dark: #08452E;
    --primary-light: #1F7A52;
    --accent: #C8A64A;
    --accent-dark: #B08F3A;
    --accent-light: #DABE6A;
    --white: #FFFFFF;
    --off-white: #F8FAF8;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --shadow: var(--shadow-md);
    --shadow-sm: var(--shadow-sm);
    --shadow-md: var(--shadow-md);
    --shadow-lg: var(--shadow-lg);
    --radius: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --bg-page: var(--color-off-white);
    --border: var(--color-gray-200);
    --row-even: var(--color-gray-50);
    --accent-hover: var(--color-accent-dark);
    --bg-masuk: #e6f4ea;
    --bg-keluar: #fce8e8;
  }

  /* ===== RESET & BASE ===== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html {
    scroll-behavior: smooth;
  }
  body {
    font-family: var(--font-family);
    background: var(--color-off-white);
    color: var(--color-gray-800);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--color-gray-100);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--color-gray-300);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--color-gray-400);
  }

  /* ===== LOADER OVERLAY ===== */
  .loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.96);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--color-gray-200);
    border-top-color: var(--color-accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== PORTAL CONTAINER ===== */
  #portal-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100%;
    background: var(--color-white);
  }

  /* ===== HEADER ===== */
  .portal-header {
    background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 60%, var(--color-primary-light) 100%);
    color: var(--color-white);
    padding: 0 40px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 24px rgba(11, 93, 63, 0.25);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 2px solid rgba(200, 166, 74, 0.3);
  }
  .portal-header .brand-title {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    letter-spacing: 1.2px;
    color: var(--color-accent);
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 700;
  }
  .portal-header .brand-title i {
    font-size: 1.8rem;
    color: var(--color-accent);
  }
  .portal-header .brand-title span {
    color: var(--color-white);
    font-weight: 300;
    letter-spacing: 0.5px;
  }
  .portal-header .brand-title .highlight {
    color: var(--color-accent);
    font-weight: 700;
  }
  .portal-header .brand-title .logo-img {
    height: 60px;
    width: auto;
    object-fit: contain;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.08);
    padding: 4px 6px;
    transition: var(--transition);
  }
  .portal-header .brand-title .logo-img:hover {
    transform: scale(1.04);
    background: rgba(255, 255, 255, 0.15);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .login-app-link {
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 24px;
    border-radius: 40px;
    color: var(--color-white);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: var(--transition);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(4px);
  }
  .login-app-link:hover {
    background: var(--color-accent);
    border-color: var(--color-accent);
    color: var(--color-primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(200, 166, 74, 0.3);
  }
  .login-app-link:active {
    transform: translateY(0);
  }

  /* ===== PORTAL BODY ===== */
  .portal-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ===== SIDEBAR PORTAL ===== */
  .sidebar-portal {
    width: 260px;
    background: var(--color-white);
    border-right: 1px solid var(--color-gray-200);
    padding: 28px 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 76px);
    position: sticky;
    top: 76px;
    overflow-y: auto;
    z-index: 50;
  }
  .sidebar-portal .menu-label {
    padding: 0 24px 12px 24px;
    font-size: 0.7rem;
    color: var(--color-gray-400);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  .sidebar-portal .nav-item {
    padding: 14px 24px;
    cursor: pointer;
    color: var(--color-gray-600);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: var(--transition);
    border-left: 3px solid transparent;
    position: relative;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .sidebar-portal .nav-item:hover {
    background: var(--color-gray-50);
    color: var(--color-primary);
  }
  .sidebar-portal .nav-item.active {
    background: rgba(11, 93, 63, 0.06);
    color: var(--color-primary);
    border-left-color: var(--color-accent);
    font-weight: 700;
  }
  .sidebar-portal .nav-item i {
    width: 22px;
    text-align: center;
    font-size: 1.05rem;
    color: var(--color-gray-400);
    transition: var(--transition);
  }
  .sidebar-portal .nav-item.active i,
  .sidebar-portal .nav-item:hover i {
    color: var(--color-primary);
  }

  .sidebar-divider {
    height: 1px;
    background: var(--color-gray-200);
    margin: 12px 24px;
  }

  /* ===== CONTENT AREA ===== */
  .content-area {
    flex: 1;
    padding: 50px 55px;
    background: var(--color-off-white);
  }
  .content-area > .animate-fade {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ============================================================
     BUTTON SYSTEM — PROFESSIONAL & CONSISTENT
     ============================================================ */
  .btn-primary,
  .btn-accent,
  .btn-gold,
  .btn-green,
  .btn-light,
  .btn-danger,
  .btn-hero,
  .btn-hero-secondary,
  .btn-sm,
  .btn-sm-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 32px;
    border: none;
    border-radius: 40px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
    font-family: var(--font-family);
    line-height: 1.4;
    text-align: center;
    white-space: nowrap;
    min-height: 48px;
  }
  .btn-primary:active,
  .btn-accent:active,
  .btn-gold:active,
  .btn-green:active,
  .btn-light:active,
  .btn-danger:active,
  .btn-hero:active,
  .btn-hero-secondary:active,
  .btn-sm:active,
  .btn-sm-outline:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: var(--color-primary);
    color: var(--color-white);
    box-shadow: 0 4px 16px rgba(11, 93, 63, 0.25);
  }
  .btn-primary:hover {
    background: var(--color-primary-dark);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(11, 93, 63, 0.35);
  }

  .btn-accent,
  .btn-gold {
    background: var(--color-accent);
    color: var(--color-white);
    box-shadow: 0 4px 16px rgba(200, 166, 74, 0.25);
  }
  .btn-accent:hover,
  .btn-gold:hover {
    background: var(--color-accent-dark);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(200, 166, 74, 0.35);
  }

  .btn-green {
    background: var(--color-primary);
    color: var(--color-white);
    box-shadow: 0 4px 16px rgba(11, 93, 63, 0.2);
  }
  .btn-green:hover {
    background: var(--color-primary-dark);
    transform: translateY(-2px);
  }

  .btn-light {
    background: var(--color-gray-100);
    color: var(--color-gray-700);
    border: 1px solid var(--color-gray-200);
  }
  .btn-light:hover {
    background: var(--color-gray-200);
    transform: translateY(-2px);
  }

  .btn-danger {
    background: var(--color-danger);
    color: var(--color-white);
  }
  .btn-danger:hover {
    background: #b91c1c;
    transform: translateY(-2px);
  }

  .btn-hero {
    background: var(--color-accent);
    color: var(--color-primary-dark);
    box-shadow: 0 4px 20px rgba(200, 166, 74, 0.35);
  }
  .btn-hero:hover {
    background: var(--color-accent-light);
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(200, 166, 74, 0.5);
  }

  .btn-hero-secondary {
    background: transparent;
    color: var(--color-white);
    border: 2px solid rgba(255, 255, 255, 0.4);
  }
  .btn-hero-secondary:hover {
    background: var(--color-white);
    color: var(--color-primary);
    border-color: var(--color-white);
    transform: translateY(-4px);
  }

  .btn-sm {
    padding: 8px 18px;
    font-size: 0.75rem;
    min-height: 36px;
    border-radius: 30px;
    background: var(--color-primary);
    color: var(--color-white);
  }
  .btn-sm:hover {
    background: var(--color-accent);
    color: var(--color-primary-dark);
    transform: translateY(-2px);
  }

  .btn-sm-outline {
    padding: 6px 16px;
    font-size: 0.7rem;
    min-height: 32px;
    border-radius: 30px;
    border: 1.5px solid var(--color-accent);
    background: transparent;
    color: var(--color-accent-dark);
  }
  .btn-sm-outline:hover {
    background: var(--color-accent);
    color: var(--color-white);
    transform: translateY(-2px);
  }

  .btn-action {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
  }
  .btn-edit {
    background: #fff9db;
    color: #f08c00;
  }
  .btn-edit:hover {
    background: #ffe066;
    transform: scale(1.08);
  }
  .btn-del {
    background: #fff5f5;
    color: #fa5252;
  }
  .btn-del:hover {
    background: #ffc9c9;
    transform: scale(1.08);
  }

  /* ============================================================
     HERO (PUBLIC)
     ============================================================ */
  .hero-banner {
    width: 100%;
    min-height: 500px;
    background-size: cover;
    background-position: center 30%;
    border-radius: var(--radius-lg);
    margin-bottom: 40px;
    position: relative;
    display: flex;
    align-items: center;
    padding: 80px 60px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .hero-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(8, 69, 46, 0.92) 0%, rgba(11, 93, 63, 0.75) 60%, rgba(31, 122, 82, 0.5) 100%);
    border-radius: var(--radius-lg);
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(8, 69, 46, 0.95) 0%, rgba(11, 93, 63, 0.6) 100%);
    border-radius: var(--radius-lg);
  }
  .hero-text {
    position: relative;
    color: var(--color-white);
    max-width: 720px;
    z-index: 1;
  }
  .hero-text .hero-eyebrow {
    display: inline-block;
    background: var(--color-accent);
    color: var(--color-primary-dark);
    padding: 6px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero-text h1 {
    font-family: var(--font-heading);
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--color-accent);
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    margin-bottom: 16px;
  }
  .hero-text p {
    font-size: 1.2rem;
    line-height: 1.8;
    color: rgba(255, 255, 255, 0.9);
    max-width: 600px;
    margin-bottom: 8px;
  }

  /* ============================================================
     SECTION HEADERS
     ============================================================ */
  .section-header {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    color: var(--color-primary);
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  .section-header .highlight {
    color: var(--color-accent);
  }
  .section-sub {
    color: var(--color-gray-500);
    font-size: 1.05rem;
    max-width: 640px;
    margin-bottom: 32px;
  }
  .section-divider {
    width: 60px;
    height: 4px;
    background: var(--color-accent);
    border-radius: 4px;
    margin-bottom: 24px;
  }

  /* ============================================================
     STATS GRID
     ============================================================ */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 24px;
    margin: 40px 0 50px 0;
  }
  .stat-card {
    background: var(--color-white);
    padding: 28px 20px;
    border-radius: var(--radius-md);
    text-align: center;
    box-shadow: var(--shadow-sm);
    border-bottom: 4px solid var(--color-accent);
    transition: var(--transition);
  }
  .stat-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
  }
  .stat-card .stat-number {
    font-family: var(--font-heading);
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--color-primary);
    line-height: 1.2;
  }
  .stat-card .stat-label {
    font-size: 0.85rem;
    color: var(--color-gray-500);
    font-weight: 500;
    margin-top: 4px;
  }
  .stat-card .stat-icon {
    font-size: 2rem;
    color: var(--color-accent);
    margin-bottom: 8px;
    display: block;
  }

  /* ============================================================
     WHY CHOOSE US
     ============================================================ */
  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
    margin: 30px 0 50px 0;
  }
  .why-card {
    background: var(--color-white);
    padding: 32px 28px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    border: 1px solid var(--color-gray-100);
    position: relative;
    overflow: hidden;
  }
  .why-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--color-accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: var(--transition);
  }
  .why-card:hover::before {
    transform: scaleX(1);
  }
  .why-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
    border-color: var(--color-accent-light);
  }
  .why-card .why-icon {
    font-size: 2.2rem;
    color: var(--color-accent);
    margin-bottom: 16px;
    display: block;
  }
  .why-card h4 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-primary);
    margin-bottom: 8px;
  }
  .why-card p {
    color: var(--color-gray-500);
    font-size: 0.9rem;
    line-height: 1.7;
    margin: 0;
  }

  /* ============================================================
     CORE BUSINESS
     ============================================================ */
  .core-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin: 30px 0 50px 0;
  }
  .core-item {
    background: var(--color-white);
    padding: 24px 20px;
    border-radius: var(--radius-md);
    text-align: center;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--color-gray-100);
    transition: var(--transition);
  }
  .core-item:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--color-accent);
  }
  .core-item .core-icon {
    font-size: 2.4rem;
    color: var(--color-primary);
    margin-bottom: 10px;
    display: block;
  }
  .core-item h5 {
    font-weight: 700;
    color: var(--color-primary);
    font-size: 0.95rem;
  }
  .core-item p {
    font-size: 0.8rem;
    color: var(--color-gray-500);
    margin: 4px 0 0 0;
  }

  /* ============================================================
     PORTFOLIO / PROJECT CARDS
     ============================================================ */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
    margin: 20px 0 40px 0;
  }
  .project-card {
    background: var(--color-white);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    border: 1px solid var(--color-gray-100);
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .project-card:hover {
    transform: translateY(-10px);
    box-shadow: var(--shadow-lg);
    border-color: var(--color-accent);
  }
  .project-card .project-img {
    height: 200px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--color-white);
    transition: var(--transition);
  }
  .project-card:hover .project-img {
    transform: scale(1.02);
  }
  .project-card .project-body {
    padding: 24px 24px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .project-card .project-cat {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--color-accent);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .project-card .project-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--color-primary);
    margin: 4px 0 8px 0;
  }
  .project-card .project-desc {
    font-size: 0.9rem;
    color: var(--color-gray-500);
    line-height: 1.6;
    flex: 1;
    margin: 0 0 12px 0;
  }
  .project-card .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--color-gray-100);
    padding-top: 14px;
    margin-top: 4px;
  }
  .project-card .card-meta .value {
    font-weight: 700;
    color: var(--color-primary);
    font-size: 1rem;
  }

  /* ============================================================
     MARKETPLACE PRODUCTS
     ============================================================ */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
    margin: 20px 0 40px 0;
  }
  .product-card {
    background: var(--color-white);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    border: 1px solid var(--color-gray-100);
    cursor: pointer;
  }
  .product-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-md);
    border-color: var(--color-accent);
  }
  .product-card .product-cover {
    height: 170px;
    background: linear-gradient(135deg, var(--color-gray-200), var(--color-gray-100));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--color-gray-300);
    position: relative;
  }
  .product-card .product-cover .product-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--color-primary);
    color: var(--color-white);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .product-card .product-cover .product-badge.available {
    background: #1F7A52;
  }
  .product-card .product-body {
    padding: 18px 20px 20px;
  }
  .product-card .product-body .product-cat {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--color-gray-400);
    font-weight: 600;
    letter-spacing: 0.8px;
  }
  .product-card .product-body h4 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--color-primary);
    margin: 4px 0 6px 0;
  }
  .product-card .product-body .product-details {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-size: 0.8rem;
    color: var(--color-gray-500);
    margin: 6px 0 10px 0;
  }
  .product-card .product-body .product-details span i {
    margin-right: 4px;
    color: var(--color-accent);
    width: 16px;
  }
  .product-card .product-body .product-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--color-gray-100);
    padding-top: 12px;
    margin-top: 4px;
  }
  .product-card .product-body .product-footer .price {
    font-weight: 700;
    color: var(--color-primary);
    font-size: 1rem;
  }

  /* ============================================================
     CATEGORY CHIPS / FILTER
     ============================================================ */
  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0 24px 0;
  }
  .category-chip {
    background: var(--color-white);
    padding: 8px 22px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--color-gray-600);
    border: 1.5px solid var(--color-gray-200);
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  .category-chip:hover {
    border-color: var(--color-accent);
    color: var(--color-primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  .category-chip.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-white);
  }
  .category-chip.active:hover {
    background: var(--color-primary-dark);
  }

  /* ============================================================
     TIMELINE MODERN
     ============================================================ */
  .timeline-modern {
    position: relative;
    padding-left: 40px;
    margin: 30px 0 40px 0;
  }
  .timeline-modern::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--color-gray-200);
    border-radius: 4px;
  }
  .timeline-item {
    position: relative;
    padding-bottom: 32px;
    padding-left: 24px;
  }
  .timeline-item:last-child {
    padding-bottom: 0;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -32px;
    top: 6px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--color-white);
    border: 3px solid var(--color-accent);
    box-shadow: 0 0 0 4px var(--color-white), 0 0 0 6px var(--color-gray-200);
  }
  .timeline-item .tl-year {
    font-family: var(--font-heading);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-accent);
    line-height: 1.2;
  }
  .timeline-item .tl-title {
    font-weight: 700;
    color: var(--color-primary);
    font-size: 1.05rem;
    margin: 2px 0 4px 0;
  }
  .timeline-item .tl-desc {
    color: var(--color-gray-500);
    font-size: 0.9rem;
    line-height: 1.7;
    max-width: 600px;
  }

  /* ============================================================
     TEAM
     ============================================================ */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 28px;
    margin: 24px 0 40px 0;
  }
  .team-card {
    background: var(--color-white);
    border-radius: var(--radius-md);
    padding: 28px 20px 24px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--color-gray-100);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    min-height: 280px;
  }
  .team-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-md);
    border-color: var(--color-accent);
  }
  .team-card .team-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--color-gray-100);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    color: var(--color-gray-300);
    border: 3px solid var(--color-accent);
    overflow: hidden;
    flex-shrink: 0;
  }
  .team-card h4 {
    font-weight: 700;
    color: var(--color-primary);
    font-size: 1.05rem;
    margin-bottom: 2px;
  }
  .team-card .team-role {
    font-size: 0.8rem;
    color: var(--color-accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .team-card .team-desc {
    font-size: 0.85rem;
    color: var(--color-gray-500);
    line-height: 1.6;
    flex: 1;
  }
  .team-card .team-social {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }
  .team-card .team-social a {
    color: var(--color-gray-400);
    transition: var(--transition);
    font-size: 1.1rem;
  }
  .team-card .team-social a:hover {
    color: var(--color-accent);
    transform: translateY(-2px);
  }

  /* ============================================================
     GALLERY
     ============================================================ */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin: 20px 0 40px 0;
  }
  .gallery-item {
    border-radius: var(--radius-md);
    overflow: hidden;
    aspect-ratio: 4/3;
    background: var(--color-gray-200);
    cursor: pointer;
    position: relative;
    transition: var(--transition);
  }
  .gallery-item:hover {
    transform: scale(1.02);
    box-shadow: var(--shadow-md);
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
  }
  .gallery-item:hover img {
    transform: scale(1.05);
  }
  .gallery-item .gallery-overlay {
    position: absolute;
    inset: 0;
    background: rgba(11, 93, 63, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: var(--transition);
    color: var(--color-white);
    font-size: 2rem;
  }
  .gallery-item:hover .gallery-overlay {
    opacity: 1;
  }

  /* ===== LIGHTBOX ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    padding: 30px;
  }
  .lightbox.active {
    display: flex;
  }
  .lightbox img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    object-fit: contain;
  }
  .lightbox .close-lightbox {
    position: absolute;
    top: 30px;
    right: 40px;
    color: var(--color-white);
    font-size: 2.5rem;
    cursor: pointer;
    transition: var(--transition);
    background: none;
    border: none;
  }
  .lightbox .close-lightbox:hover {
    transform: rotate(90deg);
    color: var(--color-accent);
  }

  /* ============================================================
     INVESTMENT SECTION
     ============================================================ */
  .investment-section {
    background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
    border-radius: var(--radius-lg);
    padding: 60px 55px;
    margin: 50px 0 30px 0;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .investment-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="300" cy="100" r="80" fill="rgba(255,255,255,0.03)"/><circle cx="80" cy="300" r="120" fill="rgba(255,255,255,0.02)"/></svg>');
    background-size: cover;
    opacity: 0.3;
  }
  .investment-section > * {
    position: relative;
    z-index: 1;
  }
  .investment-section h2 {
    font-family: var(--font-heading);
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .investment-section p {
    font-size: 1.05rem;
    opacity: 0.85;
    line-height: 1.8;
    max-width: 560px;
  }

  /* ============================================================
     CTA SECTION
     ============================================================ */
  .cta-section {
    background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
    border-radius: var(--radius-lg);
    padding: 80px 60px;
    text-align: center;
    color: var(--color-white);
    margin: 60px 0 30px 0;
    position: relative;
    overflow: hidden;
  }
  .cta-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="300" cy="100" r="80" fill="rgba(255,255,255,0.03)"/><circle cx="80" cy="300" r="120" fill="rgba(255,255,255,0.02)"/></svg>');
    background-size: cover;
    opacity: 0.3;
  }
  .cta-section > * {
    position: relative;
    z-index: 1;
  }
  .cta-section h2 {
    font-family: var(--font-heading);
    font-size: 2.6rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .cta-section p {
    font-size: 1.15rem;
    opacity: 0.85;
    max-width: 640px;
    margin: 0 auto 32px;
    line-height: 1.8;
  }
  .cta-section .cta-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  /* ============================================================
     FOOTER CORPORATE
     ============================================================ */
  .footer-corporate {
    background: var(--color-gray-900);
    color: rgba(255, 255, 255, 0.8);
    padding: 60px 50px 30px;
    border-top: 4px solid var(--color-accent);
    flex-shrink: 0;
  }
  .footer-corporate .footer-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1.5fr;
    gap: 40px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .footer-corporate .footer-brand {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    color: var(--color-accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .footer-corporate .footer-brand i {
    font-size: 1.6rem;
  }
  .footer-corporate .footer-desc {
    font-size: 0.9rem;
    line-height: 1.8;
    opacity: 0.7;
    max-width: 360px;
    margin-bottom: 16px;
  }
  .footer-corporate .footer-social {
    display: flex;
    gap: 14px;
  }
  .footer-corporate .footer-social a {
    color: rgba(255, 255, 255, 0.5);
    font-size: 1.2rem;
    transition: var(--transition);
  }
  .footer-corporate .footer-social a:hover {
    color: var(--color-accent);
    transform: translateY(-3px);
  }
  .footer-corporate h5 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--color-white);
    font-weight: 700;
    margin-bottom: 16px;
  }
  .footer-corporate ul {
    list-style: none;
    padding: 0;
  }
  .footer-corporate ul li {
    margin-bottom: 10px;
  }
  .footer-corporate ul li a {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    font-size: 0.9rem;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .footer-corporate ul li a:hover {
    color: var(--color-accent);
    transform: translateX(4px);
  }
  .footer-corporate .footer-contact-item {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 0.9rem;
    align-items: flex-start;
  }
  .footer-corporate .footer-contact-item i {
    color: var(--color-accent);
    font-size: 1rem;
    margin-top: 3px;
    width: 20px;
    text-align: center;
  }
  .footer-corporate .footer-contact-item .contact-text {
    opacity: 0.7;
    line-height: 1.6;
  }
  .footer-corporate .footer-map {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-top: 12px;
    height: 140px;
    background: var(--color-gray-700);
  }
  .footer-corporate .footer-map iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .footer-corporate .footer-bottom {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 20px;
    margin-top: 30px;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.5;
    max-width: 1280px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ============================================================
     WHATSAPP FLOAT
     ============================================================ */
  .whatsapp-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 999;
    background: #25D366;
    color: var(--color-white);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    box-shadow: 0 4px 24px rgba(37, 211, 102, 0.4);
    transition: var(--transition);
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .whatsapp-float:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 40px rgba(37, 211, 102, 0.5);
  }

  /* ============================================================
     MOBILE TOGGLE
     ============================================================ */
  .portal-menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: var(--color-white);
    font-size: 1.6rem;
    cursor: pointer;
    padding: 4px 8px;
    transition: var(--transition);
  }
  .portal-menu-toggle:hover {
    color: var(--color-accent);
  }

  /* ============================================================
     HOME TWO COLUMN
     ============================================================ */
  .home-two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin: 40px 0 30px 0;
    overflow: hidden;
  }

  /* ============================================================
     INTERNAL APP STYLES (LEGACY + IMPROVED)
     ============================================================ */
  .wrapper {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }
  .sidebar {
    width: 270px;
    background: var(--color-primary);
    color: var(--color-white);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 100vh;
    transition: transform 0.3s ease;
    overflow-y: auto;
  }
  .brand {
    padding: 30px 20px;
    text-align: center;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .brand i {
    color: var(--color-accent);
    margin-right: 10px;
  }
  .user-profile {
    padding: 25px 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.15);
    margin: 10px 15px;
    border-radius: var(--radius-md);
  }
  .user-profile .avatar i {
    font-size: 2.5rem;
    color: var(--color-accent);
    margin-bottom: 10px;
  }
  .user-profile .info span {
    display: block;
    font-weight: 600;
    font-size: 1rem;
  }
  .user-profile .info small {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.75rem;
    text-transform: uppercase;
  }
  .nav-links {
    list-style: none;
    padding: 20px 10px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .nav-links li {
    padding: 14px 20px;
    cursor: pointer;
    transition: var(--transition);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 15px;
    color: rgba(255, 255, 255, 0.7);
  }
  .nav-links li:hover,
  .nav-links li.active {
    background: rgba(255, 255, 255, 0.1);
    color: var(--color-white);
  }
  .nav-links li.active {
    border-left: 4px solid var(--color-accent);
    background: rgba(255, 255, 255, 0.15);
  }
  .has-submenu {
    flex-direction: column;
    padding: 0 !important;
  }
  .submenu-header {
    padding: 14px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .submenu-arrow {
    font-size: 0.8rem;
    transition: transform 0.3s;
  }
  .submenu {
    list-style: none;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
    width: 100%;
    padding-left: 20px;
    background: rgba(0, 0, 0, 0.05);
  }
  .submenu.active {
    max-height: 500px;
  }
  .submenu li {
    padding: 10px 20px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .submenu li:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
  }
  .logout-btn {
    margin-top: auto !important;
    color: #ff7675 !important;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--color-off-white);
  }
  .page-header-green {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--color-primary);
    color: white;
    padding: 20px 25px;
    box-shadow: var(--shadow-md);
    flex-shrink: 0;
  }
  .page-header-green h2 {
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 0;
  }
  .menu-toggle {
    background: transparent;
    border: none;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    display: none;
  }
  .page {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    height: calc(100vh - 80px);
  }
  .section-title {
    color: var(--color-primary);
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: "";
    width: 5px;
    height: 20px;
    background: var(--color-accent);
    border-radius: 10px;
  }
  .grid-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  .content-card {
    background: var(--color-white);
    padding: 30px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    margin-bottom: 30px;
  }
  .card-header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .info-item {
    padding: 15px;
    background: #fcfcfc;
    border: 1px solid var(--color-gray-100);
    border-radius: var(--radius-sm);
  }
  .info-item label {
    display: block;
    font-size: 0.7rem;
    color: var(--color-gray-500);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .info-item span {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--color-primary);
  }
  .search-container {
    position: relative;
    margin-bottom: 20px;
    width: 100%;
    max-width: 400px;
  }
  .search-container i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-gray-400);
  }
  .search-container input {
    width: 100%;
    padding: 12px 15px 12px 40px;
    border: 1px solid var(--color-gray-300);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    background: var(--color-white);
    transition: var(--transition);
  }
  .search-container input:focus {
    border-color: var(--color-accent);
    outline: none;
    box-shadow: 0 0 0 3px rgba(200, 166, 74, 0.1);
  }
  .table-res {
    overflow-x: auto;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-gray-200);
    -webkit-overflow-scrolling: touch;
    max-height: 500px;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }
  .table-green-head thead {
    background: var(--color-primary) !important;
    color: white !important;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .table-green-head th {
    padding: 18px 20px;
    text-align: left;
    font-weight: 800;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: white;
    white-space: nowrap;
  }
  td {
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-gray-200);
    font-size: 0.9rem;
    vertical-align: middle;
  }
  tbody tr:nth-child(even) {
    background: var(--color-gray-50);
  }
  tbody tr:hover {
    background-color: #f0f4f1;
  }
  .badge {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: inline-block;
  }
  .bg-masuk {
    background: #e6f4ea;
    color: #1e7e34;
  }
  .bg-keluar {
    background: #fce8e8;
    color: #d93025;
  }
  .tabs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
    -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 600;
    color: var(--color-gray-500);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: var(--transition);
  }
  .tab-btn:hover {
    color: var(--color-primary);
  }
  .tab-btn.active {
    color: var(--color-primary);
    border-bottom-color: var(--color-accent);
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    overflow-y: auto;
  }
  .modal-body {
    background: var(--color-white);
    width: 90%;
    max-width: 750px;
    margin: 40px auto;
    border-radius: var(--radius-lg);
    padding: 35px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    border-bottom: 1px solid var(--color-gray-200);
    padding-bottom: 15px;
  }
  .modal-header h3 {
    color: var(--color-primary);
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .form-group {
    margin-bottom: 0;
  }
  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--color-primary);
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1.5px solid var(--color-gray-300);
    border-radius: var(--radius-sm);
    font-family: inherit;
    transition: var(--transition);
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--color-primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(11, 93, 63, 0.1);
  }
  .modal-footer {
    margin-top: 25px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--color-gray-500);
    transition: var(--transition);
  }
  .close-btn:hover {
    color: var(--color-primary);
  }
  .btn-back-home {
    background: transparent;
    border: 1px solid var(--color-gray-200);
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-gray-600);
    font-weight: 600;
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
  }
  .btn-back-home:hover {
    background: var(--color-gray-100);
    color: var(--color-gray-800);
  }
  .login-card {
    background: var(--color-white);
    padding: 50px 40px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 420px;
    text-align: center;
    margin: 20px;
  }
  .brand-logo {
    font-size: 4rem;
    color: var(--color-primary);
    margin-bottom: 15px;
  }
  .input-group {
    text-align: left;
    margin-bottom: 20px;
  }
  .input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--color-primary);
  }
  .input-group input,
  .input-group select,
  .input-group textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--color-gray-300);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-family: inherit;
    transition: var(--transition);
  }
  .input-group input:focus,
  .input-group select:focus,
  .input-group textarea:focus {
    border-color: var(--color-primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(11, 93, 63, 0.1);
  }
  .btn-login {
    width: 100%;
    padding: 16px;
    background: var(--color-primary);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 10px;
  }
  .btn-login:hover {
    background: var(--color-primary-dark);
    transform: translateY(-2px);
  }

  /* ============================================================
     INTERNAL DASHBOARD SPECIFIC
     ============================================================ */
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--color-gray-200);
  }
  .dashboard-title {
    font-family: var(--font-heading);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--color-primary);
    margin: 0;
    letter-spacing: -0.3px;
  }
  .dashboard-subtitle {
    color: var(--color-gray-500);
    font-size: 0.95rem;
    margin: 4px 0 0 0;
  }
  .dashboard-update {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--color-gray-500);
    background: var(--color-gray-100);
    padding: 6px 14px;
    border-radius: 20px;
  }

  /* KPI Cards */
  .dashboard-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--color-white);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
    border-left: 4px solid var(--color-primary);
  }
  .kpi-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }
  .kpi-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .kpi-content {
    flex: 1;
    min-width: 0;
  }
  .kpi-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--color-gray-500);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .kpi-value {
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-gray-800);
    line-height: 1.3;
  }

  /* Financial & Membership */
  .dashboard-section {
    margin-bottom: 32px;
  }
  .section-header-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-header-wrapper .section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-primary);
    margin: 0;
  }
  .section-badge {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--color-gray-500);
    background: var(--color-gray-100);
    padding: 4px 12px;
    border-radius: 20px;
  }
  .dashboard-financial-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .financial-card {
    background: var(--color-white);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--color-primary);
  }
  .financial-card .financial-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .financial-card .financial-label {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--color-gray-700);
  }
  .financial-card .financial-label i {
    margin-right: 6px;
  }
  .financial-card .financial-value {
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--color-primary);
  }
  .financial-card .financial-detail {
    display: flex;
    gap: 20px;
    font-size: 0.85rem;
    color: var(--color-gray-500);
  }

  .dashboard-two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }
  .membership-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .membership-item {
    background: var(--color-gray-50);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .membership-item .membership-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--color-gray-500);
    font-weight: 600;
  }
  .membership-item .membership-value {
    display: block;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--color-primary);
  }

  .savings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .savings-item {
    background: var(--color-gray-50);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .savings-item .savings-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--color-gray-500);
    font-weight: 600;
  }
  .savings-item .savings-value {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    color: var(--color-accent-dark);
  }

  /* Project Mini */
  .project-mini-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .project-mini-card {
    background: var(--color-white);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    border-left: 3px solid var(--color-accent);
    cursor: pointer;
    transition: var(--transition);
  }
  .project-mini-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .project-mini-card .project-mini-name {
    font-weight: 600;
    color: var(--color-gray-800);
    font-size: 0.9rem;
  }
  .project-mini-card .project-mini-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--color-gray-500);
  }
  .project-mini-more {
    background: var(--color-gray-50);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    text-align: center;
    color: var(--color-gray-500);
    cursor: pointer;
    font-size: 0.9rem;
    transition: var(--transition);
  }
  .project-mini-more:hover {
    background: var(--color-gray-200);
  }

  /* Quick Actions */
  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .quick-actions .btn-gold,
  .quick-actions .btn-green,
  .quick-actions .btn-primary,
  .quick-actions .btn-accent {
    padding: 10px 24px;
    font-size: 0.9rem;
    min-height: 44px;
  }

  /* ============================================================
     REPORT STYLES
     ============================================================ */
  #report-content .table-res {
    margin-top: 10px;
  }
  #report-content canvas {
    max-width: 100%;
    height: auto !important;
  }
  #report-content ul {
    list-style: none;
    padding-left: 0;
  }
  #report-content ul li {
    padding: 6px 0;
    border-bottom: 1px solid var(--color-gray-200);
  }
  #report-content h4 {
    color: var(--color-primary);
    border-bottom: 2px solid var(--color-accent);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  /* ============================================================
     UTILITY
     ============================================================ */
  .hidden {
    display: none;
  }
  .mb-20 {
    margin-bottom: 20px;
  }
  .mt-20 {
    margin-top: 20px;
  }
  .text-center {
    text-align: center;
  }
  .skeleton-loader {
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--color-white);
    border-radius: var(--radius-md);
    color: var(--color-gray-400);
  }
  .skeleton-loader i {
    font-size: 2.5rem;
    color: var(--color-gray-300);
  }
  .skeleton-loader p {
    margin-top: 12px;
    font-weight: 500;
  }
  .counter-value {
    display: inline-block;
  }
  .toast-custom.warning {
    border-left-color: #ffc107;
  }

  /* ============================================================
     EMPTY STATE
     ============================================================ */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    background: var(--color-white);
    border-radius: var(--radius-md);
    border: 1px solid var(--color-gray-200);
  }
  .empty-state i {
    font-size: 3rem;
    color: var(--color-gray-300);
  }
  .empty-state h4 {
    margin-top: 16px;
    color: var(--color-gray-600);
    font-weight: 600;
  }
  .empty-state p {
    color: var(--color-gray-400);
    margin-top: 4px;
  }

  /* ============================================================
     ANIMATIONS
     ============================================================ */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade {
    animation: fadeInUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .animate-delay-1 {
    animation-delay: 0.1s;
  }
  .animate-delay-2 {
    animation-delay: 0.2s;
  }
  .animate-delay-3 {
    animation-delay: 0.3s;
  }
  .animate-delay-4 {
    animation-delay: 0.4s;
  }
  .animate-delay-5 {
    animation-delay: 0.5s;
  }

  /* ============================================================
     RESPONSIVE — MOBILE FIRST
     ============================================================ */
  @media (max-width: 1200px) {
    .content-area {
      padding: 40px 35px;
    }
    .hero-text h1 {
      font-size: 2.8rem;
    }
    .footer-corporate .footer-grid {
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
  }

  @media (max-width: 992px) {
    .portal-header {
      padding: 0 24px;
    }
    .sidebar-portal {
      width: 220px;
    }
    .content-area {
      padding: 30px 24px;
    }
    .hero-text h1 {
      font-size: 2.4rem;
    }
    .hero-banner {
      min-height: 400px;
      padding: 50px 40px;
    }
    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .dashboard-kpi-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .dashboard-financial-grid {
      grid-template-columns: 1fr;
    }
    .dashboard-two-col {
      grid-template-columns: 1fr;
    }
    .home-two-col {
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
  }

  @media (max-width: 768px) {
    .portal-header {
      padding: 0 16px;
      height: 64px;
    }
    .portal-header .brand-title {
      font-size: 1.1rem;
      gap: 8px;
    }
    .portal-header .brand-title i {
      font-size: 1.3rem;
    }
    .portal-header .brand-title span {
      display: none;
    }
    .portal-header .brand-title .highlight {
      display: inline;
    }
    .portal-header .brand-title .logo-img {
      height: 40px;
    }
    .login-app-link {
      padding: 6px 14px;
      font-size: 0.75rem;
      gap: 6px;
    }
    .login-app-link span {
      display: none;
    }
    .portal-menu-toggle {
      display: block;
    }

    .sidebar-portal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: auto;
      max-height: 60vh;
      top: auto;
      border-right: none;
      border-top: 1px solid var(--color-gray-200);
      padding: 12px 0;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--color-white);
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      gap: 4px;
      padding: 8px 12px;
      justify-content: flex-start;
    }
    .sidebar-portal.active {
      transform: translateY(0);
    }
    .sidebar-portal .menu-label {
      display: none;
    }
    .sidebar-portal .nav-item {
      padding: 10px 16px;
      white-space: nowrap;
      font-size: 0.8rem;
      border-left: none;
      border-bottom: 3px solid transparent;
      flex-shrink: 0;
    }
    .sidebar-portal .nav-item.active {
      border-bottom-color: var(--color-accent);
      border-left-color: transparent;
    }
    .sidebar-portal .nav-item i {
      font-size: 0.9rem;
      width: 18px;
    }
    .sidebar-divider {
      display: none;
    }

    .content-area {
      padding: 20px 16px;
      margin-bottom: 60px;
    }

    .hero-banner {
      min-height: 380px;
      padding: 40px 24px;
      border-radius: var(--radius-md);
    }
    .hero-text h1 {
      font-size: 2rem;
    }
    .hero-text p {
      font-size: 1rem;
    }

    .stats-grid {
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .stat-card .stat-number {
      font-size: 2rem;
    }

    .why-grid {
      grid-template-columns: 1fr 1fr;
    }
    .core-grid {
      grid-template-columns: 1fr 1fr;
    }
    .portfolio-grid {
      grid-template-columns: 1fr !important;
    }
    .product-grid {
      grid-template-columns: 1fr !important;
    }
    .section-header {
      font-size: 1.5rem;
    }

    .home-two-col {
      grid-template-columns: 1fr;
      gap: 30px;
    }

    .investment-section {
      padding: 40px 24px;
    }
    .investment-section h2 {
      font-size: 1.6rem;
    }

    .cta-section {
      padding: 50px 24px;
      margin: 40px 0 20px 0;
    }
    .cta-section h2 {
      font-size: 1.8rem;
    }
    .cta-section p {
      font-size: 1rem;
    }

    .footer-corporate {
      padding: 40px 20px 24px;
    }
    .footer-corporate .footer-grid {
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .footer-corporate .footer-map {
      height: 120px;
    }

    .whatsapp-float {
      width: 50px;
      height: 50px;
      font-size: 1.6rem;
      bottom: 80px;
      right: 16px;
    }

    .category-chip {
      font-size: 0.7rem;
      padding: 6px 14px;
    }

    .dashboard-kpi-grid {
      grid-template-columns: 1fr 1fr;
    }
    .dashboard-title {
      font-size: 1.4rem;
    }
    .dashboard-header {
      flex-direction: column;
      align-items: flex-start;
    }
    .membership-grid,
    .savings-grid {
      grid-template-columns: 1fr;
    }
    .project-mini-grid {
      grid-template-columns: 1fr;
    }
    .quick-actions {
      flex-direction: column;
    }
    .quick-actions .btn-gold,
    .quick-actions .btn-green,
    .quick-actions .btn-primary,
