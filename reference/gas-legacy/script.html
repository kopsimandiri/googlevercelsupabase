<!DOCTYPE html>
<html>
<head>
  <base target="_top">
</head>
<body>
<script>
/**
 * ====================================================================
 * KOPSIM MANDIRI — Google Apps Script Legacy KTA Canvas Generator
 * File: reference/gas-legacy/script.html
 * ====================================================================
 */

const TEXT_CONFIG = {
  name: {
    font: 'bold 36px Arial, sans-serif',
    color: '#0B3D26',
    x: 480,
    y: 290,
    align: 'left',
    transform: 'uppercase'
  },
  memberId: {
    font: 'bold 26px "Courier New", monospace',
    color: '#C9972C',
    x: 480,
    y: 340,
    align: 'left'
  },
  area: {
    font: 'bold 22px Arial, sans-serif',
    color: '#1A2E22',
    x: 480,
    y: 390,
    align: 'left',
    transform: 'uppercase'
  },
  joinDate: {
    font: '20px Arial, sans-serif',
    color: '#6B7280',
    x: 480,
    y: 435,
    align: 'left'
  }
};

/**
 * Render single member ID card on HTML5 Canvas
 */
function renderCard(canvas, member, templateImg) {
  const ctx = canvas.getContext('2d');
  const w = templateImg.naturalWidth || templateImg.width || 1011;
  const h = templateImg.naturalHeight || templateImg.height || 638;
  canvas.width = w;
  canvas.height = h;

  // Layer dasar template blanko
  ctx.drawImage(templateImg, 0, 0, w, h);

  // 1. Nama Anggota (Uppercase)
  ctx.font = TEXT_CONFIG.name.font;
  ctx.fillStyle = TEXT_CONFIG.name.color;
  ctx.textAlign = TEXT_CONFIG.name.align || 'left';
  ctx.fillText((member.nama || '').toUpperCase(), TEXT_CONFIG.name.x, TEXT_CONFIG.name.y);

  // 2. Nomor Anggota (NRA)
  ctx.font = TEXT_CONFIG.memberId.font;
  ctx.fillStyle = TEXT_CONFIG.memberId.color;
  ctx.textAlign = TEXT_CONFIG.memberId.align || 'left';
  ctx.fillText(member.id || '', TEXT_CONFIG.memberId.x, TEXT_CONFIG.memberId.y);

  // 3. Area / Plantation (Uppercase)
  ctx.font = TEXT_CONFIG.area.font;
  ctx.fillStyle = TEXT_CONFIG.area.color;
  ctx.textAlign = TEXT_CONFIG.area.align || 'left';
  const areaVal = (member.plantation || member.area_jenis || member.kota || '-').toUpperCase();
  ctx.fillText(areaVal, TEXT_CONFIG.area.x, TEXT_CONFIG.area.y);

  // 4. Tanggal Bergabung
  ctx.font = TEXT_CONFIG.joinDate.font;
  ctx.fillStyle = TEXT_CONFIG.joinDate.color;
  ctx.textAlign = TEXT_CONFIG.joinDate.align || 'left';
  ctx.fillText(member.tgl_reg || '', TEXT_CONFIG.joinDate.x, TEXT_CONFIG.joinDate.y);

  return canvas.toDataURL('image/jpeg', 1.0);
}

/**
 * Cetak Massal Semua Kartu
 */
async function generateAllCards(members, templateImg) {
  const canvas = document.createElement('canvas');
  for (let i = 0; i < members.length; i++) {
    const member = members[i];
    const dataUrl = renderCard(canvas, member, templateImg);
    const link = document.createElement('a');
    const safeName = (member.nama || 'Anggota').replace(/\s+/g, '_');
    const safeId = (member.id || 'NRA').replace(/\s+/g, '_');
    link.download = `ID_CARD_${safeName}_${safeId}.jpg`;
    link.href = dataUrl;
    link.click();
    await new Promise(r => setTimeout(r, 600));
  }
}
</script>
</body>
</html>
